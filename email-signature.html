<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex">
<title>Frontendless e-mail signature</title>
<!--
  E-mail signature for Frontendless.
  Usage: open this page in a browser, select everything inside the dashed frame with the mouse (not Ctrl+A, that
  also copies the instructions), copy, and paste into Gmail > Settings > General > Signature.
  The banner loads from https://frontendless.nl/images/email-signature.png, so it must be pushed first.
  Mail clients don't load web fonts, so the text uses Arial; the banner carries the Archivo Condensed wordmark.
  The banner has its own black background, so it reads the same in light and dark mode.
-->
<style>
  body { margin: 0; padding: 40px 24px; background: #F5F5F4; font-family: Arial, Helvetica, sans-serif; color: #3A3936; }
  .instructions { max-width: 560px; margin: 0 auto 24px; font-size: 14px; line-height: 1.5; }
  .frame { max-width: 560px; margin: 0 auto; padding: 24px; background: #FFFFFF; border: 1px dashed #A8A5A0; }
</style>
</head>
<body>
<p class="instructions">Select the signature below, copy it, and paste it into the signature settings of your mail client.</p>
<div class="frame">
<!-- SIGNATURE START -->
<table cellpadding="0" cellspacing="0" border="0" role="presentation" style="border-collapse:collapse;font-family:Archivo,Arial,Helvetica,sans-serif;">
  <tr>
    <td style="padding:0 0 2px 0;font-size:15px;line-height:20px;font-weight:bold;color:#0A0A0A;">Sjoerd Mulder</td>
  </tr>
  <tr>
    <td style="padding:0 0 14px 0;font-size:11px;line-height:16px;letter-spacing:2px;text-transform:uppercase;color:#6B6965;">Frontend expertise</td>
  </tr>
  <tr>
    <td style="padding:0 0 12px 0;">
      <a href="https://frontendless.nl/" style="text-decoration:none;"><img src="https://frontendless.nl/images/email-signature.png" width="240" height="40" alt="Frontendless" style="display:block;border:0;width:240px;height:40px;"></a>
    </td>
  </tr>
  <tr>
    <td style="font-size:13px;line-height:18px;color:#3A3936;">
      <a href="https://frontendless.nl/" style="color:#0A0A0A;text-decoration:none;font-weight:bold;">frontendless.nl</a>
      <span style="color:#A8A5A0;">&nbsp;&middot;&nbsp;</span>
      <a href="mailto:sjoerd@frontendless.nl" style="color:#0A0A0A;text-decoration:none;">sjoerd@frontendless.nl</a>
      <span style="color:#A8A5A0;">&nbsp;&middot;&nbsp;</span>
      <a href="https://www.linkedin.com/in/sjoerdmulder" style="color:#0A0A0A;text-decoration:none;">LinkedIn</a>
    </td>
  </tr>
</table>
<!-- SIGNATURE END -->
</div>
</body>
</html>
